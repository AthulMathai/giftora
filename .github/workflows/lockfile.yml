name: Refresh lockfile

# Regenerates pnpm-lock.yaml and commits it whenever dependencies change, so Vercel (which
# installs strictly from the lockfile) and CI always install the same versions.
# On pull requests it commits to the PR branch, so the lockfile is right BEFORE merging.
on:
  workflow_dispatch:
  pull_request:
    paths: ["**/package.json", "pnpm-workspace.yaml"]
  push:
    branches: [main]
    paths: ["**/package.json", "pnpm-workspace.yaml"]

permissions:
  contents: write

jobs:
  lockfile:
    # Only for branches in this repository (forks can't be pushed to).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm-lock.yaml"
            git push
          fi
