name: Refresh lockfile

# Regenerates pnpm-lock.yaml and commits it when dependencies change on main,
# so Vercel and CI install exactly the same versions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**/package.json", "pnpm-workspace.yaml"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm-lock.yaml"
            git push
          fi
